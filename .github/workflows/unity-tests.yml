name: Unity tests

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'Assets/**'
      - 'Assets/NEXO/Tests/**'
      - 'Packages/**'
      - 'ProjectSettings/**'
      - 'Tests/**'
      - '.github/workflows/unity-tests.yml'

permissions:
  contents: read

env:
  UNITY_VERSION: 6000.3.0f1

jobs:
  editmode:
    name: EditMode tests
    if: ${{ hashFiles('ProjectSettings/ProjectVersion.txt') != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with LFS
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Restore Unity Library cache
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ runner.os }}-${{ env.UNITY_VERSION }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-${{ runner.os }}-${{ env.UNITY_VERSION }}-
            Library-${{ runner.os }}-

      - name: Run EditMode tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          unityVersion: ${{ env.UNITY_VERSION }}
          testMode: editmode
          artifactsPath: test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-editmode-results
          path: test-results
          if-no-files-found: warn
