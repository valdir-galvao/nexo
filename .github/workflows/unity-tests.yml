name: Unity tests

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'Assets/**'
      - 'Assets/NEXO/Tests/**'
      - 'Packages/**'
      - 'ProjectSettings/**'
      - 'Tests/**'
      - '.github/workflows/unity-tests.yml'

permissions:
  contents: read

env:
  UNITY_VERSION: 6000.3.0f1

jobs:
  unity-tests:
    name: ${{ matrix.testMode }} tests
    if: ${{ hashFiles('ProjectSettings/ProjectVersion.txt') != '' }}
    strategy:
      fail-fast: false
      matrix:
        testMode: [editmode, playmode]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with LFS
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Verify Unity project version
        run: |
          grep -q "m_EditorVersion: ${UNITY_VERSION}" ProjectSettings/ProjectVersion.txt

      - name: Restore Unity Library cache
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ runner.os }}-${{ env.UNITY_VERSION }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-${{ runner.os }}-${{ env.UNITY_VERSION }}-
            Library-${{ runner.os }}-

      - name: Run Unity tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          unityVersion: ${{ env.UNITY_VERSION }}
          testMode: ${{ matrix.testMode }}
          artifactsPath: test-results/${{ matrix.testMode }}

      - name: Write test metadata
        if: always()
        run: |
          mkdir -p test-results
          mkdir -p "test-results/${{ matrix.testMode }}"
          printf 'platform=%s\nunity=%s\ncommit=%s\nrun_id=%s\n' "${{ matrix.testMode }}" "${UNITY_VERSION}" "${GITHUB_SHA}" "${GITHUB_RUN_ID}" > "test-results/${{ matrix.testMode }}/BUILD_METADATA.txt"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexo-tests-${{ matrix.testMode }}-${{ env.UNITY_VERSION }}-${{ github.sha }}
          path: test-results
          if-no-files-found: warn
