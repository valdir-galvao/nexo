name: Unity tests

on:
  workflow_dispatch:
  push:
    branches: [orchestrator/phase-a-baseline]
  pull_request:
    paths:
      - 'Assets/**'
      - 'Assets/NEXO/Tests/**'
      - 'Packages/**'
      - 'ProjectSettings/**'
      - 'Tests/**'
      - '.github/workflows/unity-tests.yml'

permissions:
  contents: read
  checks: write
  statuses: write

env:
  UNITY_VERSION: 6000.3.0f1
  BUILD_SCENES: Assets/Scenes/NexoVerticalSlice.unity

jobs:
  unity-tests:
    name: ${{ matrix.testMode }} tests
    strategy:
      fail-fast: false
      matrix:
        testMode: [editmode, playmode]
    runs-on: ubuntu-latest
    steps:
      - name: Free Disk Space (Lightweight Shell)
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /torch /usr/local/lib/android/sdk/sample-data 2>/dev/null || true
          df -h

      - name: Checkout with LFS
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Verify Unity project version
        run: |
          grep -q "m_EditorVersion: ${UNITY_VERSION}" ProjectSettings/ProjectVersion.txt

      - name: Prepare Unity log directory
        run: mkdir -p diagnostics/${{ matrix.testMode }}

      - name: Run Unity tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          unityVersion: ${{ env.UNITY_VERSION }}
          cliVersion: v0.1.72
          gitPrivateToken: ${{ github.token }}
          buildScenes: ${{ env.BUILD_SCENES }}
          testMode: ${{ matrix.testMode }}
          artifactsPath: test-results/${{ matrix.testMode }}
          customParameters: -logFile /github/workspace/diagnostics/${{ matrix.testMode }}/unity-editor.log

      - name: Capture Unity failure diagnostics
        if: failure()
        run: |
          mkdir -p diagnostics/${{ matrix.testMode }}
          for path in \
            /root/.config/unity3d/Editor.log \
            /root/.config/unity3d/Unity/Editor.log \
            /github/home/.config/unity3d/Editor.log \
            "$HOME/.config/unity3d/Editor.log"; do
            if [ -f "$path" ]; then
              echo "===== $path =====" | tee -a diagnostics/${{ matrix.testMode }}/unity-editor.log
              tail -n 300 "$path" | tee -a diagnostics/${{ matrix.testMode }}/unity-editor.log
            fi
          done
          find test-results -maxdepth 4 -type f -print -exec sh -c 'echo "===== $1 ====="; tail -n 200 "$1"' _ {} \; > diagnostics/${{ matrix.testMode }}/test-results.log 2>&1 || true

      - name: Write test metadata
        if: always()
        run: |
          mkdir -p test-results
          mkdir -p "test-results/${{ matrix.testMode }}"
          printf 'platform=%s\nunity=%s\ncommit=%s\nrun_id=%s\n' "${{ matrix.testMode }}" "${UNITY_VERSION}" "${GITHUB_SHA}" "${GITHUB_RUN_ID}" > "test-results/${{ matrix.testMode }}/BUILD_METADATA.txt"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexo-tests-${{ matrix.testMode }}-${{ env.UNITY_VERSION }}-${{ github.sha }}
          path: test-results
          if-no-files-found: warn

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nexo-diagnostics-${{ matrix.testMode }}-${{ env.UNITY_VERSION }}-${{ github.sha }}
          path: diagnostics/${{ matrix.testMode }}
          if-no-files-found: warn
