name: Unity activation

on:
  workflow_dispatch:

jobs:
  get-license:
    name: Request Unity cloud license
    runs-on: ubuntu-latest
    container:
      # Utilize a imagem correspondente à versão do Unity que seu projeto usa (ex: 2022.3)
      image: unityci/editor:ubuntu-2022.3.2f1-base-3
    steps:
      - name: Request activation via CLI
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          echo "Solicitando licenca na nuvem..."
          /opt/unity/Editor/Unity -quit -batchmode -nographics -logFile /dev/stdout -username "$UNITY_EMAIL" -password "$UNITY_PASSWORD" || true
          
          LICENSE_PATH="/root/.local/share/unity3d/Unity/Unity_lic.ulf"
          
          if [ -f "$LICENSE_PATH" ]; then
            echo "=================== INICIO DO .ULF ==================="
            cat "$LICENSE_PATH"
            echo "==================== FIM DO .ULF ====================="
          else
            echo "Erro: Arquivo de licenca nao foi gerado."
            exit 1
          fi
