name: Unity Build

on:
  workflow_dispatch:

jobs:
  build:
    name: Build project for Android / Windows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # (Opcional) Passo para liberar espaço em disco no runner do GitHub, recomendado para o Unity
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main

      - name: Build project
        uses: game-ci/unity-builder@v4
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          # Não é necessário definir UNITY_LICENSE para este método de autenticação automática da conta Personal
        with:
          targetAndroid: true # Ajuste para a plataforma desejada (ex: targetStandaloneWindows64: true)
          versioning: Semantic
