name: Unity activation artifact

on:
  workflow_dispatch:

# This job only requests the activation artifact. It does not upload a license
# or modify repository secrets. Manual steps are documented in docs/CICD_REPORT.md.
jobs:
  request-activation:
    name: Request Unity activation file
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Request manual activation file
        id: getManualLicenseFile
        uses: game-ci/unity-request-activation-file@v2

      - name: Upload activation artifact
        uses: actions/upload-artifact@v4
        with:
          name: unity-activation-file
          path: ${{ steps.getManualLicenseFile.outputs.filePath }}
          if-no-files-found: error
