name: Unity activation

on:
  workflow_dispatch:

jobs:
  get-alf:
    name: Request Unity .alf file
    runs-on: ubuntu-latest
    container:
      image: unityci/editor:ubuntu-2022.3.2f1-base-3 # Mantenha a versão do seu Unity
    steps:
      - name: Generate ALF file
        run: |
          /opt/unity/Editor/Unity -quit -batchmode -nographics -logFile /dev/stdout -createManualActivationFile || true
          
          ALF_PATH=$(find / -name "*.alf" 2>/dev/null | head -n 1)
          
          if [ -n "$ALF_PATH" ]; then
            echo "=================== INICIO DO .ALF ==================="
            cat "$ALF_PATH"
            echo "==================== FIM DO .ALF ====================="
          else
            echo "Erro: Arquivo .alf nao foi gerado."
            exit 1
          fi
