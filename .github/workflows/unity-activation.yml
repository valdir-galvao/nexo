name: Unity activation artifact

on:
  workflow_dispatch:

# This job requests the free Unity Personal activation artifact. It does not
# upload a license or modify repository secrets. After downloading the .alf,
# activate it through Unity's Personal license flow and store the resulting ULF
# as UNITY_LICENSE. Do not use a Pro/Plus serial. Manual steps are documented
# in docs/CICD_REPORT.md.
permissions:
  contents: read

jobs:
  request-activation:
    name: Request Unity activation file
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Request manual activation file
        id: getManualLicenseFile
        uses: game-ci/unity-request-activation-file@v2

      - name: Upload activation artifact
        uses: actions/upload-artifact@v4
        with:
          name: unity-activation-file-${{ github.run_id }}
          path: ${{ steps.getManualLicenseFile.outputs.filePath }}
          if-no-files-found: error
