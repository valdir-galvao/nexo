name: Unity iOS Xcode project

on:
  workflow_dispatch:
  push:
    branches: [orchestrator/phase-a-baseline]

permissions:
  contents: read

env:
  UNITY_VERSION: 6000.3.0f1
  BUILD_SCENES: Assets/Scenes/NexoVerticalSlice.unity

jobs:
  ios:
    name: Build iOS Xcode project
    runs-on: macos-latest
    steps:
      - name: Free Disk Space (Lightweight Shell)
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /torch /usr/local/lib/android/sdk/sample-data 2>/dev/null || true
          df -h

      - name: Checkout with LFS
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Verify Unity project version
        run: |
          grep -q "m_EditorVersion: ${UNITY_VERSION}" ProjectSettings/ProjectVersion.txt

      - name: Prepare Unity log directory
        run: mkdir -p diagnostics

      - name: Cache Unity iOS project
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Unity
          key: ios-cache-${{ runner.os }}-${{ env.UNITY_VERSION }}-${{ hashFiles('Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: |
            ios-cache-${{ runner.os }}-${{ env.UNITY_VERSION }}-

      - name: Build unsigned iOS Xcode project
        uses: game-ci/unity-builder@v6
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          NEXO_CONFIGURE_FREE_ASSETS: "1"
        with:
          projectPath: .
          unityVersion: ${{ env.UNITY_VERSION }}
          cliVersion: v0.1.72
          gitPrivateToken: ${{ github.token }}
          targetPlatform: iOS
          buildName: Nexo
          buildMethod: Nexo.Editor.Build.IosBuild.PerformBuild
          runAsHostUser: true
          customParameters: -logFile /github/workspace/diagnostics/unity-editor.log
          buildsPath: build/iOS

      - name: Package unsigned IPA from Xcode output
        shell: bash
        run: |
          set -euo pipefail
          xcodeproj="$(find build/iOS -maxdepth 5 -name '*.xcodeproj' -print -quit)"
          test -n "$xcodeproj"
          scheme="$(basename "$xcodeproj" .xcodeproj)"
          derived="build/ios-derived"
          xcodebuild \
            -project "$xcodeproj" \
            -scheme "$scheme" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$derived" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build
          app="$(find "$derived/Build/Products" -maxdepth 4 -type d -name '*.app' -print -quit)"
          test -n "$app"
          rm -rf build/ipa
          mkdir -p build/ipa/Payload
          cp -R "$app" build/ipa/Payload/
          (cd build/ipa && zip -qry ../iOS/Nexo.ipa Payload)
          file build/iOS/Nexo.ipa

      - name: Capture Unity failure diagnostics
        if: failure()
        run: |
          mkdir -p diagnostics
          for path in /Users/runner/Library/Logs/Unity/Editor.log /root/.config/unity3d/Editor.log "$HOME/.config/unity3d/Editor.log"; do
            if [ -f "$path" ]; then echo "===== $path =====" | tee -a diagnostics/unity-editor.log; tail -n 300 "$path" | tee -a diagnostics/unity-editor.log; fi
          done
          cat "$HOME/Library/Logs/Unity/Editor.log" 2>/dev/null || cat "$HOME/.config/unity3d/Unity/Editor/Editor.log" 2>/dev/null || true
          find build -maxdepth 4 -type f -print > diagnostics/build-files.log 2>&1 || true

      - name: Write build metadata
        if: always()
        run: |
          sudo chown -R "$(id -u):$(id -g)" build diagnostics 2>/dev/null || true
          mkdir -p build/iOS
          printf 'platform=iOS-Xcode-IPA\nunity=%s\ncommit=%s\nrun_id=%s\n' "${UNITY_VERSION}" "${GITHUB_SHA}" "${GITHUB_RUN_ID}" > build/iOS/BUILD_METADATA.txt

      - name: Upload Xcode project
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexo-ios-xcode-${{ github.sha }}
          path: build/iOS
          if-no-files-found: warn

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nexo-ios-diagnostics-${{ env.UNITY_VERSION }}-${{ github.sha }}
          path: diagnostics
          if-no-files-found: warn
