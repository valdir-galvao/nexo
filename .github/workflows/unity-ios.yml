name: Unity Build iOS

on:
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS Xcode Project
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Executa o build para iOS gerando o projeto Xcode no runner macOS
      - name: Build iOS
        uses: game-ci/unity-builder@v4
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: iOS
          versioning: Semantic

      # Salva o projeto Xcode gerado para download ou assinatura futura
      - name: Upload iOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-ios-xcode
          path: build/iOS
