name: Unity iOS Xcode project

on:
  workflow_dispatch:
  push:
    branches: [orchestrator/phase-a-baseline]

permissions:
  contents: read

env:
  UNITY_VERSION: 6000.3.0f1

jobs:
  ios:
    name: Build iOS Xcode project
    runs-on: macos-latest
    steps:
      - name: Checkout with LFS
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Verify Unity project version
        run: |
          grep -q "m_EditorVersion: ${UNITY_VERSION}" ProjectSettings/ProjectVersion.txt

      - name: Restore Unity Library cache
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ runner.os }}-${{ env.UNITY_VERSION }}-iOS-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-${{ runner.os }}-${{ env.UNITY_VERSION }}-iOS-
            Library-${{ runner.os }}-${{ env.UNITY_VERSION }}-

      - name: Build unsigned iOS Xcode project
        uses: game-ci/unity-builder@v6
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          BUILD_PATH: build/iOS
        with:
          projectPath: .
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: iOS
          buildMethod: Nexo.Editor.Build.IosBuild.PerformBuild
          buildPath: build/iOS

      - name: Capture Unity failure diagnostics
        if: failure()
        run: |
          mkdir -p diagnostics
          for path in /Users/runner/Library/Logs/Unity/Editor.log /root/.config/unity3d/Editor.log "$HOME/.config/unity3d/Editor.log"; do
            if [ -f "$path" ]; then echo "===== $path =====" | tee -a diagnostics/unity-editor.log; tail -n 300 "$path" | tee -a diagnostics/unity-editor.log; fi
          done
          find build -maxdepth 4 -type f -print > diagnostics/build-files.log 2>&1 || true

      - name: Write build metadata
        run: |
          printf 'platform=iOS-Xcode\nunity=%s\ncommit=%s\nrun_id=%s\n' "${UNITY_VERSION}" "${GITHUB_SHA}" "${GITHUB_RUN_ID}" > build/iOS/BUILD_METADATA.txt

      - name: Upload Xcode project
        uses: actions/upload-artifact@v4
        with:
          name: nexo-ios-xcode-${{ github.sha }}
          path: build/iOS
          if-no-files-found: error

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nexo-ios-diagnostics-${{ env.UNITY_VERSION }}-${{ github.sha }}
          path: diagnostics
          if-no-files-found: warn
