name: Unity Build iOS

on:
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS Project
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Autenticação automática com a conta Unity Personal gratuita
      - name: Activate Unity License
        uses: game-ci/unity-action@v2
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Compilação do projeto para iOS (Gera o projeto Xcode)
      - name: Build iOS
        uses: game-ci/unity-builder@v4
        with:
          targetIOS: true
          versioning: Semantic

      # Salva o projeto Xcode gerado como artefato
      - name: Upload iOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-ios-xcode
          path: build/iOS
