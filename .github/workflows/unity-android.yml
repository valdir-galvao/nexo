name: Unity Android build

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  UNITY_VERSION: 6000.3.0f1

jobs:
  android:
    name: Build Android APK
    if: ${{ hashFiles('ProjectSettings/ProjectVersion.txt') != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with LFS
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Verify Unity project version
        run: |
          grep -q "m_EditorVersion: ${UNITY_VERSION}" ProjectSettings/ProjectVersion.txt

      - name: Restore Unity Library cache
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ runner.os }}-${{ env.UNITY_VERSION }}-Android-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-${{ runner.os }}-${{ env.UNITY_VERSION }}-Android-
            Library-${{ runner.os }}-${{ env.UNITY_VERSION }}-

      - name: Build Android package
        uses: game-ci/unity-builder@v6
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          BUILD_PATH: build/Android/Nexo.apk
        with:
          projectPath: .
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: Android
          buildMethod: Nexo.Editor.Build.AndroidBuild.PerformBuild
          buildPath: build/Android

      - name: Write build metadata
        run: |
          printf 'platform=Android\nunity=%s\ncommit=%s\nrun_id=%s\n' "${UNITY_VERSION}" "${GITHUB_SHA}" "${GITHUB_RUN_ID}" > build/Android/BUILD_METADATA.txt

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexo-android-${{ github.sha }}
          path: build/Android
          if-no-files-found: error
