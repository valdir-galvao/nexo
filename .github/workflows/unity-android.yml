name: Unity Android build

on:
  workflow_dispatch:
  push:
    branches: [orchestrator/phase-a-baseline]

permissions:
  contents: read

env:
  UNITY_VERSION: 6000.3.0f1
  BUILD_SCENES: Assets/Scenes/NexoVerticalSlice.unity

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Free Disk Space (Lightweight Shell)
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /torch /usr/local/lib/android/sdk/sample-data 2>/dev/null || true
          df -h

      - name: Checkout with LFS
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Verify Unity project version
        run: |
          grep -q "m_EditorVersion: ${UNITY_VERSION}" ProjectSettings/ProjectVersion.txt

      - name: Verify Android release profile
        shell: bash
        run: |
          set -euo pipefail
          grep -q '^  AndroidTargetSdkVersion: 35$' ProjectSettings/ProjectSettings.asset
          grep -q '^  AndroidMinSdkVersion: 29$' ProjectSettings/ProjectSettings.asset
          grep -q '^  androidTargetArchitectures: 3$' ProjectSettings/ProjectSettings.asset
          grep -q '^    Android: 1$' ProjectSettings/ProjectSettings.asset
          test "${BUILD_SCENES}" = "Assets/Scenes/NexoVerticalSlice.unity"

      - name: Prepare Unity log directory
        run: mkdir -p diagnostics

      - name: Cache Unity Android project
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/Unity
          key: android-cache-${{ runner.os }}-${{ env.UNITY_VERSION }}-${{ hashFiles('Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: |
            android-cache-${{ runner.os }}-${{ env.UNITY_VERSION }}-

      - name: Build Android package
        uses: game-ci/unity-builder@v6
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          unityVersion: ${{ env.UNITY_VERSION }}
          cliVersion: v0.1.72
          gitPrivateToken: ${{ github.token }}
          targetPlatform: Android
          buildName: Nexo
          buildMethod: Nexo.Editor.Build.AndroidBuild.PerformBuild
          runAsHostUser: true
          customParameters: -logFile /github/workspace/diagnostics/unity-editor.log
          buildsPath: build/Android

      - name: Capture Unity failure diagnostics
        if: failure()
        run: |
          mkdir -p diagnostics
          for path in /root/.config/unity3d/Editor.log /root/.config/unity3d/Unity/Editor.log /github/home/.config/unity3d/Editor.log "$HOME/.config/unity3d/Editor.log"; do
            if [ -f "$path" ]; then echo "===== $path =====" | tee -a diagnostics/unity-editor.log; tail -n 300 "$path" | tee -a diagnostics/unity-editor.log; fi
          done
          cat "$HOME/Library/Logs/Unity/Editor.log" 2>/dev/null || cat "$HOME/.config/unity3d/Unity/Editor/Editor.log" 2>/dev/null || true
          find build -maxdepth 4 -type f -print > diagnostics/build-files.log 2>&1 || true

      - name: Write build metadata
        if: always()
        run: |
          sudo chown -R "$(id -u):$(id -g)" build diagnostics 2>/dev/null || true
          mkdir -p build/Android
          printf 'platform=Android\nbuild_type=Release\ntarget_api=35\nmin_api=29\narchitectures=ARMv7+ARM64\nscripting_backend=IL2CPP\nunity=%s\ncommit=%s\nrun_id=%s\n' "${UNITY_VERSION}" "${GITHUB_SHA}" "${GITHUB_RUN_ID}" > build/Android/BUILD_METADATA.txt

      - name: Upload Android artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexo-android-${{ github.sha }}
          path: build/Android
          if-no-files-found: warn

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nexo-android-diagnostics-${{ env.UNITY_VERSION }}-${{ github.sha }}
          path: diagnostics
          if-no-files-found: warn

  android-emulator:
    name: Install and launch APK on Android emulator
    needs: android
    if: needs.android.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout smoke test script
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Download APK from this run
        uses: actions/download-artifact@v4
        with:
          pattern: nexo-android-*
          merge-multiple: true
          path: .

      - name: Locate APK
        shell: bash
        run: |
          set -euo pipefail
          find . -type f -name 'Nexo.apk' -print
          test -n "$(find . -type f -name 'Nexo.apk' -print -quit)"

      - name: Enable KVM
        shell: bash
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run emulator smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: bash tools/android_smoke_test.sh

      - name: Upload Android runtime diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-emulator-diagnostics-${{ github.run_id }}
          path: diagnostics/android
          if-no-files-found: warn
