name: Unity Android build

on:
  workflow_dispatch:
    inputs:
      architecture:
        description: 'Native ABI for this APK (use X86_64 only for the AVD)'
        required: false
        type: choice
        options: [ARM64, X86_64]
        default: ARM64
  push:
    branches: [orchestrator/phase-a-baseline]

permissions:
  contents: read

env:
  UNITY_VERSION: 6000.3.0f1
  BUILD_SCENES: Assets/Scenes/NexoVerticalSlice.unity
  NEXO_ANDROID_ARCH: ${{ inputs.architecture || 'ARM64' }}

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    # A cold GameCI Unity 6 + IL2CPP image can take longer than 30 minutes
    # while the Android toolchain and both native architectures are prepared.
    # Keep a bounded upper limit without terminating a valid cold build early.
    timeout-minutes: 120
    steps:
      - name: Free Disk Space (Lightweight Shell)
        shell: bash
        run: |
          set -euo pipefail
          echo 'Disk before cleanup:'
          df -h /
          # GameCI downloads a large Unity Android image. Remove host-only SDKs
          # and toolchains that are not used inside the GameCI container.
          sudo rm -rf \
            /usr/share/dotnet \
            /opt/ghc \
            /opt/az \
            /opt/google \
            /opt/microsoft \
            /opt/hostedtoolcache \
            /usr/local/share/powershell \
            /usr/local/julia \
            /usr/local/lib/node_modules \
            /usr/local/lib/android/sdk \
            /usr/local/share/chromium \
            /usr/local/share/vscode \
            /torch \
            "$HOME/.cache" \
            "$HOME/.npm" \
            "$HOME/.cargo" \
            "$HOME/.rustup" 2>/dev/null || true
          # Hosted images often retain large package-manager caches outside the
          # workspace. They are not needed by GameCI and can exhaust the small
          # free volume while Unity/Gradle expands its temporary tree.
          sudo rm -rf /var/lib/apt/lists/* /var/cache/apt/* /var/log/*.log 2>/dev/null || true
          timeout 45s docker system prune --all --force --volumes 2>/dev/null || true
          sudo journalctl --vacuum-time=1d 2>/dev/null || true
          echo 'Disk after cleanup:'
          df -h

      - name: Checkout with LFS
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Verify Unity project version
        run: |
          grep -q "m_EditorVersion: ${UNITY_VERSION}" ProjectSettings/ProjectVersion.txt

      - name: Verify Android release profile
        shell: bash
        run: |
          set -euo pipefail
          grep -q '^  AndroidTargetSdkVersion: 35$' ProjectSettings/ProjectSettings.asset
          grep -q '^  AndroidMinSdkVersion: 29$' ProjectSettings/ProjectSettings.asset
          grep -q '^  androidTargetArchitectures: 3$' ProjectSettings/ProjectSettings.asset
          grep -q '^    Android: 1$' ProjectSettings/ProjectSettings.asset
          test "${BUILD_SCENES}" = "Assets/Scenes/NexoVerticalSlice.unity"
          test "${NEXO_ANDROID_ARCH}" = ARM64 || test "${NEXO_ANDROID_ARCH}" = X86_64

      - name: Prepare Unity log directory
        run: mkdir -p diagnostics

      - name: Invalidate stale Unity and Gradle caches
        shell: bash
        run: |
          set -euo pipefail
          # Do not reuse potentially corrupted native build state. The Unity
          # package cache is restored below with an explicit v2 key.
          rm -rf "$HOME/.gradle/caches" "$HOME/.gradle/wrapper" "$HOME/.cache/Unity" || true
          mkdir -p "$HOME/.gradle"
          df -h /

      - name: Verify build headroom
        shell: bash
        run: |
          set -euo pipefail
          available_kb="$(df --output=avail / | tail -n 1 | tr -d ' ')"
          echo "Available disk before GameCI: ${available_kb} KB"
          # The Unity 6 IL2CPP + Gradle temporary tree can grow substantially.
          # Fail before consuming the full job when the runner is already critically full.
          test "${available_kb}" -ge 15000000

      - name: Start Android build watchdog
        shell: bash
        run: |
          set -u
          watchdog_dir="$RUNNER_TEMP/nexo-android-watchdog"
          mkdir -p "$watchdog_dir"
          : > "$watchdog_dir/build-watchdog.log"
          (
            while true; do
              {
                echo "===== $(date -u +%Y-%m-%dT%H:%M:%SZ) ====="
                echo '-- disk --'
                df -h / /github/workspace 2>/dev/null || true
                echo '-- memory --'
                free -h 2>/dev/null || true
                echo '-- docker --'
                docker ps --no-trunc 2>/dev/null || true
                docker stats --no-stream 2>/dev/null || true
                echo '-- unity/gradle processes --'
                ps -eo pid,ppid,stat,etime,%cpu,%mem,comm --sort=-%cpu | grep -E 'unity|gradle|java|il2cpp|bee|game-ci|docker' | head -n 80 || true
              } >> "$watchdog_dir/build-watchdog.log" 2>&1
              sleep 30
            done
          ) &
          echo $! > "$watchdog_dir/build-watchdog.pid"

      - name: Build Android package
        timeout-minutes: 105
        uses: game-ci/unity-builder@v6
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          NEXO_CONFIGURE_FREE_ASSETS: "1"
          NEXO_DEVELOPMENT_BUILD: "0"
          NEXO_ANDROID_ARCH: ${{ env.NEXO_ANDROID_ARCH }}
          GRADLE_OPTS: >-
            -Dorg.gradle.jvmargs=-Xmx4096m
            -Dorg.gradle.daemon=false
            -Dorg.gradle.logging.level=info
            -Dorg.gradle.warning.mode=all
        with:
          projectPath: .
          unityVersion: ${{ env.UNITY_VERSION }}
          cliVersion: v0.1.72
          gitPrivateToken: ${{ github.token }}
          targetPlatform: Android
          buildName: Nexo
          buildMethod: Nexo.Editor.Build.AndroidBuild.PerformBuild
          runAsHostUser: true
          customParameters: -batchmode -nographics -quit -single-instance -disable-assembly-reload -buildTarget Android -customBuildTarget Android -logFile /github/workspace/diagnostics/unity-editor.log
          buildsPath: build/Android

      - name: Stop Android build watchdog
        if: always()
        shell: bash
        run: |
          watchdog_dir="$RUNNER_TEMP/nexo-android-watchdog"
          if [ -f "$watchdog_dir/build-watchdog.pid" ]; then
            kill "$(cat "$watchdog_dir/build-watchdog.pid")" 2>/dev/null || true
          fi
          echo '===== final watchdog snapshot ====='
          tail -n 200 "$watchdog_dir/build-watchdog.log" 2>/dev/null || true
          mkdir -p diagnostics
          cp "$watchdog_dir/build-watchdog.log" diagnostics/build-watchdog.log 2>/dev/null || true

      - name: Capture Unity failure diagnostics
        if: failure()
        run: |
          mkdir -p diagnostics
          for path in /root/.config/unity3d/Editor.log /root/.config/unity3d/Unity/Editor.log /github/home/.config/unity3d/Editor.log "$HOME/.config/unity3d/Editor.log"; do
            if [ -f "$path" ]; then echo "===== $path =====" | tee -a diagnostics/unity-editor.log; tail -n 300 "$path" | tee -a diagnostics/unity-editor.log; fi
          done
          cat "$HOME/Library/Logs/Unity/Editor.log" 2>/dev/null || cat "$HOME/.config/unity3d/Unity/Editor/Editor.log" 2>/dev/null || true
          find build -maxdepth 4 -type f -print > diagnostics/build-files.log 2>&1 || true

      - name: Write build metadata
        if: always()
        run: |
          sudo chown -R "$(id -u):$(id -g)" build diagnostics 2>/dev/null || true
          mkdir -p build/Android
          printf 'platform=Android\nbuild_type=Release\ntarget_api=35\nmin_api=29\narchitecture=%s\nscripting_backend=IL2CPP\nunity=%s\ncommit=%s\nrun_id=%s\n' "${NEXO_ANDROID_ARCH}" "${UNITY_VERSION}" "${GITHUB_SHA}" "${GITHUB_RUN_ID}" > build/Android/BUILD_METADATA.txt

      - name: Upload Android artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexo-android-${{ env.NEXO_ANDROID_ARCH }}-${{ github.sha }}
          path: build/Android
          if-no-files-found: warn

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nexo-android-diagnostics-${{ env.UNITY_VERSION }}-${{ github.sha }}
          path: diagnostics
          if-no-files-found: warn

  android-emulator:
    name: Install and launch APK on Android emulator
    needs: android
    if: needs.android.result == 'success' && (inputs.architecture == 'X86_64')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout smoke test script
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Download APK from this run
        uses: actions/download-artifact@v4
        with:
          pattern: nexo-android-X86_64-*
          merge-multiple: true
          path: .

      - name: Locate APK
        shell: bash
        run: |
          set -euo pipefail
          find . -type f -name 'Nexo.apk' -print
          test -n "$(find . -type f -name 'Nexo.apk' -print -quit)"

      - name: Enable KVM
        shell: bash
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run emulator smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: bash tools/android_smoke_test.sh

      - name: Upload Android runtime diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-emulator-diagnostics-${{ github.run_id }}
          path: diagnostics/android
          if-no-files-found: warn
